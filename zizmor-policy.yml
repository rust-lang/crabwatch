# Zizmor policy used by crabwatch.
#
# crabwatch runs a curated set of zizmor audits.
# zizmor has no allow-list, so we need to explicitly disable every audit we don't want to run.
#
# Lints are documented at https://docs.zizmor.sh/audits/.
default:
  # Configuration shared by every repository.
  rules:
    # Enabled
    archived-uses:
      disable: false
    bot-conditions:
      disable: false
    cache-poisoning:
      disable: false
    github-env:
      disable: false
    hardcoded-container-credentials:
      disable: false
    impostor-commit:
      disable: false
    insecure-commands:
      disable: false
    insecure-url-scheme:
      disable: false
    known-vulnerable-actions:
      disable: false
    misfeature:
      disable: false
    obfuscation:
      disable: false
    overprovisioned-secrets:
      disable: false
    ref-confusion:
      disable: false
    secrets-inherit:
      disable: false
    self-hosted-runner:
      disable: false
    typosquat-uses:
      disable: false
    unpinned-tools:
      disable: false
    unredacted-secrets:
      disable: false
    unsound-condition:
      disable: false
    unsound-contains:
      disable: false
    unsound-ternary:
      disable: false
    use-trusted-publishing:
      disable: false

    # Disabled
    adhoc-packages:
      disable: true
    anonymous-definition:
      # Disabled because it doesn't have a security impact.
      disable: true
    artipacked:
      disable: true
    concurrency-limits:
      disable: true
    dangerous-triggers:
      disable: true
    # rust-lang repos also adopt Renovate for dependency updates,
    # hence related Dependabot-related audits are disabled by default.
    dependabot-cooldown:
      # Repositories using Dependabot should enable this audit
      disable: true
    dependabot-execution:
      # Repositories using Dependabot should enable this audit
      disable: true
    excessive-permissions:
      disable: true
    forbidden-uses:
      # Does nothing by default; it must be configured to use it.
      disable: true
    github-app:
      disable: true
    ref-version-mismatch:
      disable: true
    secrets-outside-env:
      # TODO: This lint requires the auditor persona,
      # while crabwatch uses the pedantic persona.
      disable: true
    self-repository:
      disable: true
    stale-action-refs:
      disable: true
    superfluous-actions:
      disable: true
    template-injection:
      disable: true
    undocumented-permissions:
      disable: true
    unpinned-images:
      disable: true
    unpinned-uses:
      disable: true

repositories:
  # Override `default` in specific repositories.
  rust-lang/backtrace-rs:
    rules:
      # TODO
      unsound-ternary:
        disable: true
  rust-lang/chalk:
    # Chalk is unused at the moment and it's going to be archived soon probably.
    # Fixing lints it's not worth it.
    rules:
      archived-uses:
        disable: true
      use-trusted-publishing:
        disable: true
  rust-lang/mdBook:
    # Blocked by https://github.com/rust-lang/mdBook/pull/3232
    rules:
      ref-confusion:
        disable: true
  rust-lang/cargo-bisect-rustc:
    rules:
      # TODO
      use-trusted-publishing:
        disable: true
  rust-lang/libz-sys:
    rules:
      # TODO
      use-trusted-publishing:
        disable: true
  rust-lang/rust-analyzer:
    rules:
      cache-poisoning:
        # TODO
        disable: true
      # TODO
      use-trusted-publishing:
        disable: true
  rust-lang/rust-bindgen:
    rules:
      # TODO
      use-trusted-publishing:
        disable: true
  rust-lang/beyond-refs:
    rules:
      unpinned-tools:
        # TODO
        disable: true
  rust-lang/cc-rs:
    rules:
      github-env:
        # TODO
        disable: true
      ref-version-mismatch:
        disable: false
      stale-action-refs:
        disable: false
      unpinned-uses:
        disable: false
  rust-lang/odht:
    rules:
      obfuscation:
        # TODO
        disable: true
  rust-lang/rust-clippy:
    rules:
      cache-poisoning:
        # TODO
        disable: true
  rust-lang/rustup:
    rules:
      cache-poisoning:
        # TODO
        disable: true
  rust-lang/crabwatch:
    # Opt in to the disabled audits that pass for this repository.
    rules:
      adhoc-packages:
        disable: false
      anonymous-definition:
        disable: false
      artipacked:
        disable: false
      concurrency-limits:
        disable: false
      dangerous-triggers:
        disable: false
      dependabot-cooldown:
        disable: false
      excessive-permissions:
        disable: false
      github-app:
        disable: false
      misfeature:
        disable: false
      ref-version-mismatch:
        disable: false
      stale-action-refs:
        disable: false
      superfluous-actions:
        disable: false
      template-injection:
        disable: false
      undocumented-permissions:
        disable: false
      unpinned-images:
        disable: false
      unpinned-uses:
        disable: false
  rust-lang/josh-sync:
    rules:
      adhoc-packages:
        disable: false
      dangerous-triggers:
        disable: false
      ref-version-mismatch:
        disable: false
      self-repository:
        disable: false
      stale-action-refs:
        disable: false
      superfluous-actions:
        disable: false
      unpinned-images:
        disable: false
      unpinned-uses:
        disable: false
  rust-lang/a-mir-formality:
    rules:
      ref-version-mismatch:
        disable: false
      stale-action-refs:
        disable: false
      unpinned-uses:
        disable: false
