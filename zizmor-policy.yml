# Zizmor policy used by crabwatch.
#
# crabwatch runs a curated set of zizmor audits.
# zizmor has no allow-list, so we need to explicitly disable every audit we don't want to run.
#
# Lints are documented at https://docs.zizmor.sh/audits/.
default:
  # Configuration shared by every repository.
  rules:
    # Enabled
    adhoc-packages:
      disable: false
    archived-uses:
      disable: false
    bot-conditions:
      disable: false
    cache-poisoning:
      disable: false
    dangerous-triggers:
      disable: false
    dependabot-execution:
      disable: false
    github-env:
      disable: false
    hardcoded-container-credentials:
      disable: false
    impostor-commit:
      disable: false
    insecure-commands:
      disable: false
    insecure-url-scheme:
      disable: false
    known-vulnerable-actions:
      disable: false
    misfeature:
      disable: false
    obfuscation:
      disable: false
    overprovisioned-secrets:
      disable: false
    ref-confusion:
      disable: false
    secrets-inherit:
      disable: false
    self-hosted-runner:
      disable: false
    self-repository:
      disable: false
    typosquat-uses:
      disable: false
    unpinned-tools:
      disable: false
    unredacted-secrets:
      disable: false
    unsound-condition:
      disable: false
    unsound-contains:
      disable: false
    unsound-ternary:
      disable: false
    use-trusted-publishing:
      disable: false

    # Disabled
    anonymous-definition:
      # Disabled because it doesn't have a security impact.
      disable: true
    artipacked:
      disable: true
    concurrency-limits:
      # Disabled because:
      # - sometimes it is too restrictive, and you might need to silence it
      # - it doesn't affect security
      # - it's too noisy
      disable: true
    dependabot-cooldown:
      # Repositories using Dependabot cooldowns should enable this audit
      # if the default cooldown period of 3 days isn't enough.
      disable: true
    excessive-permissions:
      disable: true
    forbidden-uses:
      # Does nothing by default; it must be configured to use it.
      disable: true
    github-app:
      disable: true
    ref-version-mismatch:
      disable: true
    secrets-outside-env:
      # TODO: This lint requires the auditor persona,
      # while crabwatch uses the pedantic persona.
      disable: true
    stale-action-refs:
      disable: true
    superfluous-actions:
      disable: true
    template-injection:
      disable: true
    undocumented-permissions:
      disable: true
    unpinned-images:
      disable: true
    unpinned-uses:
      disable: true

repositories:
  # Override `default` in specific repositories.
  rust-lang/backtrace-rs:
    rules:
      artipacked:
