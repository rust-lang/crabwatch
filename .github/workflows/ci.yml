name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt clippy

      - name: Build
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: "--deny warnings"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # Overrides must match GitHub's canonical repository names. Catch typos,
      # renamed/deleted repositories, and incorrect casing before an override is
      # silently skipped.
      # Limitation: `github.token` cannot read private repositories, so those fail here with a 404.
      - name: Validate policy repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repository in $(yq '.repositories | keys | .[]' zizmor-policy.yml); do
            canonical=$(gh api "repos/$repository" --jq .full_name)
            if [[ "$repository" != "$canonical" ]]; then
              echo "Policy repository '$repository' must use GitHub's canonical name '$canonical'." >&2
              exit 1
            fi
          done

  typos:
    name: Typos
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read zizmor version
        id: zizmor-version
        run: |
          version=$(yq --exit-status '.jobs.zizmor.steps[] | select(.uses == "zizmorcore/zizmor-action@*") | .with.version' .github/workflows/crabwatch.yml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          advanced-security: false
          version: ${{ steps.zizmor-version.outputs.version }}
  # Summary job for the merge queue.
  # ALL THE PREVIOUS JOBS NEED TO BE ADDED TO THE `needs` SECTION OF THIS JOB!
  CI:
    name: CI
    needs: [test, typos, zizmor]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Conclusion
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          # Print the dependent jobs so the log shows what was checked.
          jq -C <<< "$NEEDS"
          # Fail unless every needed job ended in success or was a legitimate skip.
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$NEEDS"
