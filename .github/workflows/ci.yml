name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          components: rustfmt clippy

      - name: Build
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: "--deny warnings"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # Overrides must match GitHub's canonical repository names. Catch typos,
      # renamed/deleted repositories, and incorrect casing before an override is
      # silently skipped.
      # Limitation: `github.token` cannot read private repositories, so those fail here with a 404.
      - name: Validate policy repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repository in $(yq '.repositories | keys | .[]' zizmor-policy.yml); do
            canonical=$(gh api "repos/$repository" --jq .full_name)
            if [[ "$repository" != "$canonical" ]]; then
              echo "Policy repository '$repository' must use GitHub's canonical name '$canonical'." >&2
              exit 1
            fi
          done

  typos:
    name: Typos
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read zizmor version
        id: zizmor-version
        uses: $/.github/actions/zizmor-version

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          advanced-security: false
          version: ${{ steps.zizmor-version.outputs.version }}

  # Fail if zizmor reports findings in any rust-lang repository that the CLI
  # analyzes, so that the changes don't break the CI of other repositories.
  analyze-org:
    name: Analyze rust-lang
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: analyze-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read zizmor version
        id: zizmor-version
        uses: $/.github/actions/zizmor-version

      - name: Install zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zizmor-version.outputs.version }}
        run: |
          asset=zizmor-x86_64-unknown-linux-gnu.tar.gz
          gh release download "v$VERSION" --repo zizmorcore/zizmor --pattern "$asset" --dir "$RUNNER_TEMP"
          gh release verify-asset "v$VERSION" "$RUNNER_TEMP/$asset" --repo zizmorcore/zizmor
          mkdir "$RUNNER_TEMP/zizmor"
          tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory "$RUNNER_TEMP/zizmor"
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"

      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          # Don't run rust-cache with the GitHub App secrets.
          cache: false

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.CRABWATCH_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CRABWATCH_GH_APP_PRIVATE_KEY }}
          # The scan reads every repository of the organization, including
          # the private ones that `github.token` can't access.
          owner: rust-lang # zizmor: ignore[github-app]
          permission-contents: read

      # The logs of this repository are public, so use `--redact-private` to hide
      # data of private repositories.
      - name: Analyze rust-lang
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: cargo run --locked -- analyze --org rust-lang --redact-private

  # Summary job for the merge queue.
  # ALL THE PREVIOUS JOBS NEED TO BE ADDED TO THE `needs` SECTION OF THIS JOB!
  CI:
    name: CI
    needs: [test, typos, zizmor, analyze-org]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Conclusion
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          # Print the dependent jobs so the log shows what was checked.
          jq -C <<< "$NEEDS"
          # Fail unless every needed job ended in success or was a legitimate skip.
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$NEEDS"
