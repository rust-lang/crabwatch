name: Setup Rust
description: Install the Rust toolchain pinned in rust-toolchain.toml and set up caching

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustc -vV

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
